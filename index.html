<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laurden</title>
    <style>
        :root {
            --bg: #121213;
            --border: #3a3a3c;
            --correct: #538d4e;
            --present: #b59f3b;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        header {
            width: 100%;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 8vw, 2.5rem);
            letter-spacing: 0.3rem;
            font-weight: 300;
            text-transform: uppercase;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 270px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.9rem;
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s, color 0.2s;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* 1. Play Laurdle (Primary green) */
        .btn-laurdle {
            background-color: var(--correct);
            color: white;
            border: 1.5px solid var(--correct);
        }

        .btn-laurdle:hover {
            transform: scale(1.04);
            background-color: #4a7a46;
            border-color: #4a7a46;
        }

        /* 2. Wedding Countdown (Harmonized Wordle gold) */
        .btn-countdown {
            background-color: transparent;
            color: #e5e5e5;
            border: 1.5px solid var(--present);
        }

        .btn-countdown:hover {
            transform: scale(1.04);
            background-color: rgba(181, 159, 59, 0.12);
            color: var(--text);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <header>
        <h1>Laurden</h1>
    </header>
    <div class="container">
        <div class="button-group">
            <a href="/laurdle/" class="btn btn-laurdle">Play Laurdle</a>
            <a href="https://laurden.ca/act1/" class="btn btn-laurdle">Escape</a>
            <a href="/countdown/" class="btn btn-countdown">08 · 13 · 27 ❤️</a>
        </div>
    </div>
</body>
</html>
