<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Locked Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #1b222d 0%, #0c1017 65%, #05070a 100%);
      --accent-glow: rgba(235, 179, 114, 0.18);
      --gold: #dfb275;
      --gold-hover: #f3cb93;
      --text-main: #f0f3f6;
      --text-muted: #9ba3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }

    /* Ambient vignette & subtle particle effect */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, var(--accent-glow) 0%, transparent 60%);
      pointer-events: none;
    }

    .container {
      max-width: 580px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
      animation: fadeIn 1.2s ease-out forwards;
    }

    .icon-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 2rem;
      border-radius: 50%;
      border: 1px solid rgba(223, 178, 117, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(18, 24, 34, 0.65);
      box-shadow: 0 0 24px rgba(223, 178, 117, 0.15);
      color: var(--gold);
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    .icon-badge svg {
      width: 32px;
      height: 32px;
    }

    .pre-title {
      font-family: 'Cinzel', serif;
      font-size: 0.825rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.25rem;
      opacity: 0.9;
    }

    .main-title {
      font-family: 'Cinzel', serif;
      font-size: 2.15rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 1rem;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .subtitle {
      font-size: 1.25rem;
      font-weight: 300;
      color: var(--gold-hover);
      letter-spacing: 0.04em;
      margin-bottom: 2.5rem;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 0.95rem 2.5rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .action-btn:hover {
      background: var(--gold);
      color: #0c1017;
      box-shadow: 0 0 28px rgba(223, 178, 117, 0.4);
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .hint {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseGlow {
      from {
        box-shadow: 0 0 16px rgba(223, 178, 117, 0.1);
        border-color: rgba(223, 178, 117, 0.25);
      }
      to {
        box-shadow: 0 0 32px rgba(223, 178, 117, 0.3);
        border-color: rgba(223, 178, 117, 0.55);
      }
    }

    @media (max-width: 600px) {
      .main-title {
        font-size: 1.75rem;
      }
      .subtitle {
        font-size: 1.1rem;
      }
      .action-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- Keyhole / Padlock Icon -->
    <div class="icon-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <p class="pre-title">Chapter I</p>
    <h1 class="main-title">You've found yourself trapped in a locked room.</h1>
    <p class="subtitle">Can you escape?</p>

    <!-- Adjust href to wherever your first puzzle or route starts -->
    <a href="key/index.html" class="action-btn" id="startBtn">
      <span>Begin Escape</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </main>

  <script>
    // Optional smooth fade-out effect when clicking the start button
    document.getElementById('startBtn').addEventListener('click', function (e) {
      const target = this.getAttribute('href');
      if (target && !target.startsWith('#')) {
        e.preventDefault();
        document.querySelector('.container').style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        document.querySelector('.container').style.opacity = '0';
        document.querySelector('.container').style.transform = 'translateY(-10px)';
        setTimeout(() => {
          window.location.href = target;
        }, 500);
      }
    });
  </script>
</body>
</html>
